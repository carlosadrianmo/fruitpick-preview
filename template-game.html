	<style>
  /* Fades in and out */
	.fade-enter-active,
.fade-leave-active {
  transition: opacity 0.5s ease;
  
}

.fade-enter-from,
.fade-leave-to {
  opacity: 0;
  
}	
/* Slides on vertical axis */
.slide-y-enter-active,
.slide-y-leave-active {
  transition: all 0.5s ease;
  transform: translateY(0);
}

.slide-y-enter-from,
.slide-y-leave-to {
  transform: translateY(20px);
}
  
 /* Slides on horizontal axis */
  aside {
    transition: all 0.185s ease;
    
  }
  body {
    background: url('images/background.jpg') center top no-repeat;
    background-size: 100% auto;
  }
  .slide-x {
   transform: translateX(0);
  }
  .action-close {
    display: block;
  }
  .action-open {
    display: none; 
  }
  .translate-x-full .action-open {
    display: block;
  }
   .translate-x-full .action-close { 
     display: none;
   }
  
.slide-x-enter-active,
.slide-x-leave-active {
  transition: all 0.5s ease;
  transform: translateX(0);
  position: fixed;
  top: 0;
}

.slide-x-enter-from,
.slide-x-leave-to {
  transform: translateX(100%);
  position: fixed;
  top: 0;
}
  @keyframes beat {
    0% {
      transform: scale(1)
    }
        50% {
      transform: scale(1.24)
    }
        100% {
      transform: scale(1)
    }
  }
  .animate-beat {
    animation: beat;
    animation-duration: 600;
  }

  <script>
  
  const doc = document;
  
  function getNearbyCoordsFrom(coords) {
    coords.latitude += 0.00001 * (9 * Math.random()) //;_.random(-9, 9);
    coords.longitude += 0.00001 * (9 * Math.random()) //_.random(-9, 9);
    return coords;
  }
  
  function addFruitsAround(coords, scene) {
    let fruits = ['peach', 'apple', 'pineapple'];
    fruits.forEach((item) => {
      let node = doc.createElement('a-element')
      ;
      // node.setAttribute('model-gltf', '#' + item.slug);
      // node.setAttribute('id', 'fruit-' + crypto.uuid());
      node.setAttribute('model-gltf', '#' + item);
      node.setAttribute('gps-new-entity-place', getNearbyCoordsFrom(coords))
      node.setAttribute('pickable', null)
      
      scene.appendChild(node)
    })
    return fruits.length;
  }
  
    let camera = doc.querySelector('[gps-new-camera]');
				let pet = doc.createElement('a-entity');
				let scene = doc.querySelector('a-scene');
			let	lib = doc.querySelector('a-assets');
				lib.addEventListener('loaded', () => {
  					pet.setAttribute('gltf-model', '#cat-small');
  					pet.setAttribute('size', { x: 5, y: 5, z: 5});
				//  pet.setAttribute('position', { x: -1, y: 0, z: -5});
				  pet.setAttribute('patpat', null);
				  pet.setAttribute('id', 'pet');
				  pet.setAttribute('draggable', null);
  					scene.appendChild(pet);
				 
  					// app.assets.loaded = true;
  					camera.addEventListener('gps-camera-update-position', (ev) => {
    						let coords = ev.detail.position;
    						
    						coords.latitude -= 0.0000085;
  					  
    						coords.longitude -= 0.00001;
    						
    						pet.setAttribute('gps-new-entity-place', coords);
    						let added = addFruitsAround(coords, scene)
  					  console.log(`found ${added} fruits`)
    						console.log(coords.latitude, coords.longitude)
				  
  					});
				  
				 });

		pet.setAttribute('look-at', '[gps-new-camera]');
