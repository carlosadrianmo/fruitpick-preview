	<style>
  /* Fades in and out */
	.fade-enter-active,
.fade-leave-active {
  transition: opacity 0.5s ease;
  
}

.fade-enter-from,
.fade-leave-to {
  opacity: 0;
  
}	
/* Slides on vertical axis */
.slide-y-enter-active,
.slide-y-leave-active {
  transition: all 0.5s ease;
  transform: translateY(0);
}

.slide-y-enter-from,
.slide-y-leave-to {
  transform: translateY(20px);
}
  
 /* Slides on horizontal axis */
  aside {
    transition: all 0.185s ease;
    
  }
  body {
    background: url('images/background.jpg') center top no-repeat;
    background-size: 100% auto;
  }
  .slide-x {
    
   transform: translateX(0);
  }
  .action-close {
    display: block;
  }
  .action-open {
    display: none; 
  }
  .translate-x-full .action-open {
    display: block;
  }
   .translate-x-full .action-close { 
     display: none;
   }
  
.slide-x-enter-active,
.slide-x-leave-active {
  transition: all 0.5s ease;
  transform: translateX(0);
  position: fixed;
  top: 0;
}

.slide-x-enter-from,
.slide-x-leave-to {
  transform: translateX(100%);
  position: fixed;
  top: 0;
}
  
	</style>
  
  
    <script src="js/vendor/aframe.min.js"></script>
